<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Gestión Hotelera Premium</title>
    <link rel="stylesheet" href="/maqueta/css/login.css">
</head>
<body>
     <header>
        <nav class="navbar">
            <div class="nav-left">
                <div class="logo-container">
                    <img src="/maqueta/imagenes/logo.png" alt="404 Logo" class="logo-img">
                </div>
                <span class="brand-name">404 Room Not Found</span>
            </div>
            <input type="checkbox" id="menu-toggle" class="menu-checkbox">
            <label for="menu-toggle" class="mobile-menu-btn">
                <i class="fas fa-bars"></i>
            </label>
            
            <ul class="nav-links">
                <li><a href="index.html" class="nav-item">Inicio</a></li>
                <li><a href="quienes-somos.html" class="nav-item">Quiénes Somos</a></li>
                <li><a href="registro.html" class="nav-item">Registrar</a></li>
                <li><a href="login.html" class="nav-item">Iniciar Sesión</a></li>
                <li><a href="#" class="btn-reservation">Reservar Ahora</a></li>
            </ul>
        </nav>
    </header>

    
    <div class="login-wrapper-background">
        
        <div class="formulario">
            <h1>Inicio de Sesión</h1>
            <form method="get" action="dashboard-usuario.html">
                
                <div class="username">
                    <input type="email" name="email" required>
                    <span></span>
                    <label>Correo Electrónico</label>
                </div>
                
                <div class="password">
                    <input type="password" name="password" required>
                    <span></span>
                    <label>Contraseña</label>
                </div>
                
                <div class="buttom">
                    <input type="submit" value="Iniciar Sesión">
                </div>
                
                <div class="olvidaste_tu_contrasena">¿Olvidaste tu Contraseña?</div>
                
                <div class="registrarse">
                    <a href="registro.html">Quiero Registrarme</a>
                </div>
            </form>
        </div>

    </div>

    <footer class="simple-footer">
        <div class="footer-content">
            <div class="footer-brand">
                <div class="footer-logo-circle">
                    <img src="/maqueta/imagenes/logo.png" alt="404 Logo">
                </div>
            </div>
            <hr class="footer-line">
            <p class="copyright">&copy; 2026 404 Room Not Found. Todos los derechos reservados.</p>
        </div>
    </footer>

</body>
</html>
