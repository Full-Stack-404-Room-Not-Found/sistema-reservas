<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Gestión Hotelera Premium</title>
    <link rel="stylesheet" href="../css/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
     <header>
        <nav class="navbar">
            <div class="nav-left">
                <a href="../index.html" class="nav-home">
                    <div class="logo-container">
                        <img src="../imagenes/logo.png" alt="404 Logo" class="logo-img">
                    </div>
                    <span class="brand-name">404 Room Not Found</span>
                </a>
            </div>
            <input type="checkbox" id="menu-toggle" class="menu-checkbox">
            <label for="menu-toggle" class="mobile-menu-btn">
                <i class="fas fa-bars"></i>
            </label>
            
            <ul class="nav-links">
                <li><a href="../index.html" class="nav-item">Inicio</a></li>
                <li><a href="./quienes-somos.html" class="nav-item">Quiénes Somos</a></li>
                <li><a href="./registro.html" class="nav-item">Registrar</a></li>
                <li><a href="./login.html" class="nav-item">Iniciar Sesión</a></li>
                <li><a href="#" class="btn-reservation">Reservar Ahora</a></li>
            </ul>
        </nav>
    </header>

        <div class="login-wrapper-background">
    
            <div class="form-card">
                <h1>Inicio de Sesión</h1>
                <form method="get" action="./dashboard-usuario/index.html">
    
                    <div class="username">
                        <input id="correo" type="email" name="email" required>
                        <span></span>
                        <label for="correo"> Correo Electrónico</label>
                    </div>
    
                    <div class="password">
                        <input id="password" type="password" name="password" required>
                        <span></span>
                        <label for="password">Contraseña</label>
                    </div>
    
                    <div class="form-submit">
                        <button type="submit" class="btn btn-warning login-btn">Iniciar Sesión</button>
                    </div>
    
                    <div class="forgot-password">¿Olvidaste tu Contraseña?</div>
    
                    <div class="signup-link">
                        <a href="./registro.html">Quiero Registrarme</a>
                    </div>
                </form>
            </div>
    
        </div>

    <footer class="simple-footer">
        <div class="footer-content">
            <div class="footer-brand">
                <div class="footer-logo-circle">
                    <img src="../imagenes/logo.png" alt="404 Logo">
                </div>
            </div>
            <hr class="footer-line">
            <p class="copyright">&copy; 2026 404 Room Not Found. Todos los derechos reservados.</p>
        </div>
    </footer>

</body>
</html>
