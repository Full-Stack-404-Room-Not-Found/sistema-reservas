<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Usuario | Sistema de Gestión</title>
    <link rel="stylesheet" href="../../css/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/dashboard-usuario/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <div class="dashboard-container">
        <header>
            <nav class="navbar">
                <div class="nav-left">
                    <a href="../../index.html" class="nav-home">
                        <div class="logo-container">
                            <img src="../../imagenes/logo.png" alt="404 Logo" class="logo-img">
                        </div>
                        <span class="brand-name">404 Room Not Found</span>
                    </a>
                </div>
                <input type="checkbox" id="menu-toggle" class="menu-checkbox">
                <label for="menu-toggle" class="mobile-menu-btn">
                    <i class="fas fa-bars"></i>
                </label>

                <ul class="nav-links">
                    <li><a href="../../index.html" class="nav-item">Inicio</a></li>
                    <li><a href="../quienes-somos.html" class="nav-item">Quiénes Somos</a></li>
                    <li><a href="./buscar-habitacion.html" class="btn-reservation">Reservar Ahora</a></li>
                    <li><a href="./reservas.html" class="btn-reservation">Mis Reservas</a></li>
                </ul>
            </nav>
        </header>

        <main class="main-content">

            <section class="search-room">

                <div class="section-title">
                    <h2>Buscar Habitaciones</h2>
                </div>

                <form class="search-form">

                    <div class="form-group">
                        <label for="checkin">Check-in</label>
                        <input type="date" id="checkin">
                    </div>

                    <div class="form-group">
                        <label for="checkout">Check-out</label>
                        <input type="date" id="checkout">
                    </div>

                    <div class="form-group">

                        <label for="huespedes">Huéspedes</label>
                        <select id="huespedes">
                            <option>1 Persona</option>
                            <option>2 Personas</option>
                            <option>3 Personas</option>
                            <option>4 Personas</option>
                            <option>5 Personas</option>
                        </select>

                    </div>

                    <div class="form-group">

                        <label for="room-type">Tipo Habitación</label>
                        <select id="room-type">
                            <option>Suite</option>
                            <option>Doble</option>
                            <option>Premium</option>
                            <option>Familiar</option>
                        </select>

                    </div>

                    <button type="submit" class="btn-search">
                        Buscar Habitaciones
                    </button>

                </form>

            </section>

            <section class="rooms-section">

                <div class="section-title">
                    <h2>Habitaciones Disponibles</h2>
                </div>

                <div class="rooms-container">

                    <article class="room-card">
                        <img src="../../imagenes/suite.jpg" alt="Habitación Premium">
                        <div class="room-info">
                            <h3>Habitación Premium</h3>
                            <div class="room-details">
                                <span>
                                    <i class="fa-solid fa-user-group"></i>
                                    2 Personas
                                </span>
                                <span>
                                    <i class="fa-solid fa-dollar-sign"></i>
                                    120.000 / noche
                                </span>
                            </div>
                            <button class="btn-reserve">
                                Más Detalles
                            </button>
                        </div>
                    </article>

                    <article class="room-card">
                        <img src="../../imagenes/suite2.jpg" alt="Suite Deluxe">
                        <div class="room-info">
                            <h3>Habitación Suite</h3>
                            <div class="room-details">
                                <span>
                                    <i class="fa-solid fa-user-group"></i>
                                    4 Personas
                                </span>
                                <span>
                                    <i class="fa-solid fa-dollar-sign"></i>
                                    250.000 / noche
                                </span>
                            </div>
                            <button class="btn-reserve">
                                Más Detalles
                            </button>
                        </div>
                    </article>

                </div>

            </section>
        </main>

        <footer class="simple-footer">
            <div class="footer-content">
                <div class="footer-brand">
                    <div class="footer-logo-circle">
                        <img src="../../imagenes/logo.png" alt="404 Logo">
                    </div>
                </div>
                <hr class="footer-line">
                <p class="copyright">&copy; 2026 404 Room Not Found. Todos los derechos reservados.</p>
            </div>
        </footer>

    </div>
</body>

</html>
