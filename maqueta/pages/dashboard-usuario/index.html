<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Usuario | Sistema de Gestión de Reserva</title>

    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/dashboard-usuario/index.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="dashboard-container">

        <!-- ================= SIDEBAR (BARRA LATERAL) ================= -->

        <aside class="sidebar">

            <div class="logo">
                <h2>Sistema de Gestión</h2>
            </div>

            <nav class="sidebar-menu">

                <ul>

                    <li class="sidebar-menu-Selected">
                        <a href="./index.html" class="item-menu">
                            <i class="fa-solid fa-house"></i>
                            Inicio
                        </a>
                    </li>

                    <li>
                        <a href="./buscar-habitacion.html" class="item-menu">
                            <i class="fa-solid fa-bed"></i>
                            Buscar Habitaciones
                        </a>
                    </li>

                    <li>
                        <a href="./reservas.html" class="item-menu">
                            <i class="fa-solid fa-calendar-check"></i>
                            Mis Reservas
                        </a>
                    </li>

                    <li>
                        <a href="./servicios.html" class="item-menu">
                            <i class="fa-solid fa-bell-concierge"></i>
                            Servicios
                        </a>
                    </li>

                    <li>
                        <a href="./perfil.html" class="item-menu">
                            <i class="fa-solid fa-user"></i>
                            Mi Perfil
                        </a>
                    </li>

                </ul>

            </nav>

            <div class="logout cerrar-session">
                <a href="../login.html" class="item-menu">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Cerrar Sesión
                </a>
            </div>

        </aside>

        <!-- ================= INICIO ================= -->

        <main class="main-content">

            <header class="topbar">

                <div class="welcome-text">
                    <h1>Bienvenida, Nanu</h1>
                    <p>
                        Gestiona tus reservas y encuentra tu próxima habitación.
                    </p>
                </div>

                <div class="topbar-actions">
                    <button class="notification-btn">
                        <i class="fa-regular fa-bell"></i>
                    </button>

                    <div class="profile-image">
                        <img src="https://i.pravatar.cc/150" alt="Avatar Usuario">
                    </div>
                </div>

            </header>

            <!-- ================= RESUMEN ================= -->

            <section class="summary-cards">

                <article class="summary-card">
                    <div>
                        <h3>Reservas Activas</h3>
                        <p>2</p>
                    </div>
                    <i class="fa-solid fa-hotel"></i>
                </article>

                <article class="summary-card">
                    <div>
                        <h3>Próximo Check-in</h3>
                        <p>18 Mayo</p>
                    </div>
                    <i class="fa-solid fa-calendar-days"></i>
                </article>

                <article class="summary-card">
                    <div>
                        <h3>Servicios Contratados</h3>
                        <p>5</p>
                    </div>
                    <i class="fa-solid fa-spa"></i>
                </article>

                <article class="summary-card">
                    <div>
                        <h3>Historial</h3>
                        <p>12 Reservas</p>
                    </div>
                    <i class="fa-solid fa-clock-rotate-left"></i>
                </article>

            </section> 


            
        </main>

    </div>

</body>

</html>
