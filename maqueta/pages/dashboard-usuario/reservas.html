<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Usuario | Sistema de Gestión</title>

    <link rel="stylesheet" href="../../css/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/dashboard-usuario/index.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="dashboard-container">

        <!-- ================= BARRA LATERAL ================= -->

        <header>
            <nav class="navbar">
                <div class="nav-left">
                    <a href="./index.html" class="nav-home">
                        <div class="logo-container">
                            <img src="../../imagenes/logo.png" alt="404 Logo" class="logo-img">
                        </div>
                        <span class="brand-name">404 Room Not Found</span>
                    </a>
                </div>
                <input type="checkbox" id="menu-toggle" class="menu-checkbox">
                <label for="menu-toggle" class="mobile-menu-btn">
                    <i class="fas fa-bars"></i>
                </label>

                <ul class="nav-links">
                    <li><a href="../../index.html" class="nav-item">Inicio</a></li>
                    <li><a href="../quienes-somos.html" class="nav-item">Quiénes Somos</a></li>

                    <li><a href="./buscar-habitacion.html" class="btn-reservation">Reservar Ahora</a></li>
                    <li><a href="./reservas.html" class="btn-reservation">Mis Reservas</a></li>
                </ul>
            </nav>
        </header>

        <main class="main-content">

            <header class="topbar">

                <div class="welcome-text">

                    <h1>Bienvenida, Nanu</h1>

                    <p>
                        Gestiona tus reservas y encuentra tu próxima habitación.
                    </p>

                </div>

                <div class="topbar-actions">
                    <button class="notification-btn">
                        <i class="fa-regular fa-bell"></i>
                    </button>
                    <div class="profile-image">
                        <img src="https://i.pravatar.cc/150" alt="Avatar Usuario">
                    </div>

                </div>

            </header>

            <!-- ================= MIS RESERVAS ================= -->

            <section class="reservations-section">

                <div class="section-title">
                    <h2>Mis Reservas</h2>
                </div>

                <div class="table-container">

                    <table>

                        <thead>
                            <tr>
                                <th>Habitación</th>
                                <th>Check-in</th>
                                <th>Check-out</th>
                                <th>Estado</th>
                            </tr>
                        </thead>

                        <tbody>

                            <tr>
                                <td>Suite</td>
                                <td>18/05/2026</td>
                                <td>22/05/2026</td>
                                <td class="status-confirmed">
                                    Confirmada
                                </td>
                            </tr>

                            <tr>
                                <td>Premium</td>
                                <td>10/06/2026</td>
                                <td>15/06/2026</td>
                                <td class="status-pending">
                                    Pendiente
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </section>
           
        </main>

    </div>

</body>

</html>
