<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Sistema de Gestión Hotelera - Panel Administrador</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tus CSS -->
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/dashboard-admin/index.css">
</head>

<body>

    <div class="contenedor">
        <h1>🏨 SISTEMA DE GESTIÓN HOTELERA - ADMINISTRADOR</h1>

        <!-- Grilla Bootstrap para tarjetas -->
        <div class="container mb-4">
            <div class="row">
                <div class="col-md-4">
                    <div class="carta disponible">
                        <div class="numero">12</div>
                        <div>🟢 Habitaciones Disponibles</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="carta ocupada">
                        <div class="numero">8</div>
                        <div>🔴 Habitaciones Ocupadas</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="carta mantenimiento">
                        <div class="numero">4</div>
                        <div>🟡 En Mantenimiento</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabla (sin cambios) -->
        <table class="tabla-habitaciones">
            <thead>
                <tr>
                    <th>N° Hab.</th>
                    <th>Tipo</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr class="fila-habitacion">
                    <td>101</td <td>Standard</td <td><span class="estado disponible-texto">🟢 Disponible</span></td <td
                        class="acciones">
                    <a href="./detalle-habitacion.html" class="btn btn-primary btn-sm">Ver</a>
                    <a href="./detalle-habitacion.html" class="btn btn-warning btn-sm">Editar</a>
                    </td </tr <!-- repetir para 102,103,104,105 -->
            </tbody>
        </table>
    </div>

</body>

</html>
