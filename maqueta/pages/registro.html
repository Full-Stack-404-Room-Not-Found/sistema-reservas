<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Gestión Hotelera Premium</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/registro.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="nav-left">
                <a href="../index.html" class="nav-home">
                    <div class="logo-container">
                        <img src="../imagenes/logo.png" alt="404 Logo" class="logo-img">
                    </div>
                    <span class="brand-name">404 Room Not Found</span>
                </a>
            </div>
            <input type="checkbox" id="menu-toggle" class="menu-checkbox">
            <label for="menu-toggle" class="mobile-menu-btn">
                <i class="fas fa-bars"></i>
            </label>
            
            <ul class="nav-links">
                <li><a href="../index.html" class="nav-item">Inicio</a></li>
                <li><a href="./quienes-somos.html" class="nav-item">Quiénes Somos</a></li>
                <li><a href="./registro.html" class="nav-item">Registrar</a></li>
                <li><a href="./login.html" class="nav-item">Iniciar Sesión</a></li>
                <li><a href="#" class="btn-reservation">Reservar Ahora</a></li>
            </ul>
        </nav>
    </header>
    
    <div class="login-wrapper-background">
        
        <div class="formulario">
            <h1>Crear Cuenta</h1>
            <form method="post">
                <div class="campo">
                    <input type="text" required /><span></span>
                    <label>Nombre</label>
                </div>
                <div class="campo">
                    <input type="text" required /><span></span>
                    <label>Apellido</label>
                </div>
                <div class="campo">
                    <input type="email" required /><span></span>
                    <label>Correo Electrónico</label>
                </div>
                <div class="campo">
                    <input type="password" required /><span></span>
                    <label>Contraseña</label>
                </div>
                <div class="campo">
                    <input type="password" required /><span></span>
                    <label>Confirmar Contraseña</label>
                </div>
                <div class="buttom">
                    <input type="submit" value="Registrarse" />
                </div>
                <div class="ya-tenés-cuenta">
                    ¿Ya tenés cuenta? <a href="./login.html">Iniciá Sesión</a>
                </div>
            </form>
        </div>

    </div>

    <footer class="simple-footer">
        <div class="footer-content">
            <div class="footer-brand">
                <div class="footer-logo-circle">
                    <img src="../imagenes/logo.png" alt="404 Logo">
                </div>
            </div>
            <hr class="footer-line">
            <p class="copyright">&copy; 2026 404 Room Not Found. Todos los derechos reservados.</p>
        </div>
    </footer>

</body>
</html>
