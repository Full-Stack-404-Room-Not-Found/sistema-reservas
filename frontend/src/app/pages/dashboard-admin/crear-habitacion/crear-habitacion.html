<!-- CU-03, flujos 1 y 2: el mismo formulario sirve para el alta y la edición -->
<div class="contenedor">
  <h2>✏️ {{ id ? 'Editar' : 'Nueva' }} Habitación</h2>

  <div class="form-card">
    <form [formGroup]="form" (ngSubmit)="guardar()">
      <div class="form-group">
        <label>Número:</label>
        <input type="text" formControlName="numero" />
      </div>

      <div class="form-group">
        <label>Tipo:</label>
        <select formControlName="tipo">
          <option value="">Elegí un tipo</option>
          <option value="Standard">Standard</option>
          <option value="Doble">Doble</option>
          <option value="Suite">Suite</option>
          <option value="Familiar">Familiar</option>
        </select>
      </div>

      <div class="form-group">
        <label>Estado:</label>
        <select formControlName="estado">
          <option value="Disponible">Disponible</option>
          <option value="Ocupada">Ocupada</option>
          <option value="Mantenimiento">Mantenimiento</option>
          <option value="Inactiva">Inactiva</option>
        </select>
      </div>

      <div class="form-group">
        <label>Precio por noche:</label>
        <input type="number" formControlName="precio_noche" />
      </div>

      <div class="form-group">
        <label>Capacidad:</label>
        <input type="number" formControlName="capacidad" />
      </div>

      <div class="form-group">
        <label>Comodidades:</label>
        <!-- Las comodidades vienen de la API; lo tildado se guarda en la tabla puente -->
        <div class="checkbox-group" formArrayName="comodidades">
          @for (comodidad of comodidadesDisponibles; track comodidad.id; let i = $index) {
            <label class="checkbox-option">
              <input type="checkbox" [formControlName]="i" />
              {{ comodidad.nombre_comodidad }}
            </label>
          }
        </div>
      </div>

      <div class="form-group">
        <label>Descripción:</label>
        <textarea formControlName="descripcion" rows="3"></textarea>
      </div>

      <!-- Mensajes literales de los flujos alternativos A1 a A4 del CU-03 -->
      @if (error) {
        <p class="text-danger">{{ error }}</p>
      }

      <div class="actions">
        <button type="submit" class="btn-primary" [disabled]="guardando">💾 Guardar</button>
        <a routerLink="/dashboard-admin/inicio" class="btn-secondary">⬅ Cancelar</a>
      </div>
    </form>
  </div>
</div>
